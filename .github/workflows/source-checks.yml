name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  rules:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source-art test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Rule regression tests (no model calls)
        run: python -m unittest discover -s tests -v
      - name: Original puppet geometry
        run: node prototypes/shadow-puppets/verify.cjs
      - name: Whitespace
        run: git show --check --oneline --format=short HEAD
